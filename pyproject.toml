[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyb2"
version = "0.1.0"
description = "Python port of the HYB2 RNA proximity-ligation pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy",    # cplfold backend (the default): bonus-matrix construction in comrades_fold
    "pandas",   # hyb2_compare: DESeq_interaction_split_select
    "pyyaml",   # for parsing args in yaml file
    "tqdm",     # for progress bars
]

[project.optional-dependencies]
dev = ["pytest"]
# The cplfold backend additionally needs a local CPLfold clone + a per-machine
# HotKnots build (not pip-installable -- see README_python_port.md section 2).
cplfold = ["numba", "scipy"]

# Not wired into PATH as `hyb2` yet -- the legacy bin/hyb2 Bash orchestrator
# stays authoritative until every stage it calls has been ported and
# parity-checked against fixtures/. Invoke this during migration via
# `python -m hyb2`.
[project.scripts]
hyb2-py = "hyb2.cli:main"
hyb2-sam-composition = "hyb2.pipelines.sam_composition:main"
hyb2-coverage = "hyb2.pipelines.hyb2_coverage:main"
plot-cdm = "hyb2.pipelines.hyb2_coverage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
