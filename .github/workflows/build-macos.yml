name: native-macos
on:
  workflow_dispatch:
  push:
    branches: [python-migration]
    paths: [environment.yml, pyproject.toml, .github/workflows/build-macos.yml]   # re-check when deps change

jobs:
  native-arm64:
    runs-on: macos-14                 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest   # installs Miniforge (osx-arm64)
      - name: create env
        shell: bash -el {0}           # -l so conda activation works in the step
        run: conda env create -f environment.yml
      - name: smoke
        shell: bash -el {0}
        run: conda run -n hyb2 hyb2 --help