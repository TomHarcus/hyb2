# hyb2 coverage config
# pass with: hyb2-coverage --config standalone_fold.yml
# CLI flags override anything set here for full flexibility

#verbose:         True               # -V verbose on or off
input:            output.hyb         # -i  hyb
gene_1:           Zika_virusRNA      # -a  gene of interest
# gene_2:         18S_rRNA           # -b  second gene (intermolecular/homodimer)
# limit:          0.95               # upper quantile for heatmap contrast (default=0.95)
# x1:             None               # zoom window X start
# x2:             None               # zoom window X end
# y1:             None               # zoom window Y start
# y2:             None               # zoom window Y end