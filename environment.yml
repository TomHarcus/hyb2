name: hyb2
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12

  # folding / mapping tools (subprocess deps)
  - viennarna=2.7.0   #RNAcofold / RNAfold / b2ct (vienna + cplfold support matrix)
  - bowtie2=2.5.4     # read mapping
  - oligoarrayaux=3.8.1     # hybrid-min / hybrid-ss-min (unafold backend)

  # R + plotting (Rscript subprocess)
  - r-base=4.3
  - bioconductor-deseq2=1.42.0
  - r-ggplot2=3.5.1
  - r-data.table=1.15.2

  # cross-platform correctness
  - coreutils     # GNU sort on MacOS (parity critical for collapse_blast)
  - openjdk     # java for VARNA

  # cplfold python deps -- from conda so they use conda-forge's prebuilt osx-64
  # numba/llvmlite. Via pip, llvmlite has no osx-64 wheel and builds from source,
  # which needs cmake and fails on Apple Silicon (osx-64 under Rosetta).
  - numba
  - scipy

  # the package itself + its remaining pip deps (numpy / pandas / pyyaml / tqdm)
  - pip
  - pip:
      - -e .[cplfold,dev]